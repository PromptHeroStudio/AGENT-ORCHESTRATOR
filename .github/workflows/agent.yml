name: Agent Orchestrator

on:
  workflow_dispatch:
    inputs:
      task_description:
        description: 'Kratak opis zadatka (opciono, za vašu evidenciju)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Preuzmi repozitorijum
        uses: actions/checkout@v4

      - name: Podesi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instaliraj zavisnosti
        run: |
          pip install --upgrade pip
          pip install openai requests

      - name: Pokreni orkestrator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
        run: |
          python scripts/orchestrator.py

      - name: Komituj rezultat nazad u repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output.md
          if git diff --staged --quiet; then
            echo "Nema promena — output.md nije menjan."
          else
            git commit -m "Agent output: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
